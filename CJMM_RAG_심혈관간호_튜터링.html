<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CJMM 기반 RAG 심혈관 간호 튜터링 시스템 (가상 데모)</title>
<style>
:root{
  --bg:#f3f6f9; --card:#fff; --line:#e3e8ee; --ink:#1d2733; --sub:#5b6776; --mut:#8a95a3;
  --teal:#0e8f80; --teal-d:#0a7568; --teal-l:#e6f5f2; --blue:#1b5fd0; --blue-l:#e8f0fd;
  --green:#2aa05a; --amber:#d98a1d; --red:#d6453d; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:60px minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh}
/* header */
.hdr{display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:5}
.hdr .burger{background:none;border:0;font-size:22px;color:var(--sub);padding:4px 8px}
.hdr h1{font-size:19px;margin:0;font-weight:700;white-space:nowrap}
.demo{font-size:11px;background:#fff4dc;color:#8a5a00;border:1px solid #f0d9a0;border-radius:20px;padding:2px 9px;white-space:nowrap}
.hdr .sp{flex:1}
.weekpill{display:flex;align-items:center;gap:6px;color:var(--blue);font-weight:600}
.weekpill button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;color:var(--blue)}
.weekpill button:disabled{opacity:.35;cursor:default}
.weekpill select{font:inherit;color:var(--blue);font-weight:600;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.bell{position:relative;background:none;border:0;font-size:20px}
.bell .badge{position:absolute;top:-4px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center}
.user{display:flex;align-items:center;gap:10px;padding-left:14px;border-left:1px solid var(--line)}
.user b{display:block;font-size:13px}.user small{color:var(--sub);font-size:11px}
.avatar{width:38px;height:38px;border-radius:50%;background:#d7dde5;display:grid;place-items:center;font-size:20px}
.pop{position:absolute;top:56px;right:200px;width:300px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,40,60,.15);padding:6px;display:none}
.pop.on{display:block}
.pop div{padding:9px 10px;border-radius:8px;font-size:13px}.pop div:hover{background:var(--bg)}
.pop small{display:block;color:var(--mut)}
/* body */
.body{display:grid;grid-template-columns:230px minmax(0,1fr) 430px;min-height:0}
.body.nosb{grid-template-columns:0 minmax(0,1fr) 430px}
.body.nosb .side{display:none}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:none;border-radius:8px;font-size:15px;color:var(--sub);text-align:left;margin-bottom:2px}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--blue);color:#fff;font-weight:600}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:#fafbfd}
.box h4{margin:0 0 10px;font-size:14px}
.kv{display:flex;gap:14px;font-size:12px;margin-bottom:10px}.kv span:first-child{color:var(--sub)}
.bar{height:6px;background:#e5eaf0;border-radius:4px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:4px;transition:width .4s}
.btn-o{width:100%;padding:8px;border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:8px;font-weight:600}
.btn-o:hover{background:var(--blue-l)}
.main{overflow:auto;padding:18px 20px 30px}
.rt{background:var(--bg);overflow:auto;padding:12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-height:0}
.rt .tutor{flex:1 0 auto;min-height:max(440px,62vh)}
.rt .ev{flex:none;padding:10px 12px}
.rt .evl{max-height:130px;overflow:auto;padding-right:2px}
.rt .evi{padding:8px 10px;margin-bottom:6px}
.rt .disc{flex:none;font-size:10.5px;line-height:1.35}
.tutor .th{padding:8px 12px}
.tutor .qb{padding:4px 12px 10px}.tutor .qb button{padding:6px 10px;font-size:12.5px}
.tutor .inrow{padding:8px 12px 6px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card h3{margin:0 0 12px;font-size:15px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:14px;padding:6px 6px 0}
.hero small{color:var(--teal);font-weight:700;font-size:15px}
.hero h2{margin:2px 0 8px;font-size:28px;line-height:1.25}
.hero p{margin:0;color:var(--sub);max-width:560px}
.heroart{flex:none;width:210px;height:120px;position:relative}
.heroart .emo{position:absolute;right:0;top:4px;font-size:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.heroart svg{position:absolute;left:0;top:10px}
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fcfdfe}
.item .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.item .tx{flex:1;min-width:0}.item b{display:block;font-size:14px}.item small{color:var(--sub);font-size:12px}
.chip{flex:none;font-size:12px;display:flex;align-items:center;gap:4px;font-weight:600}
.chip.done{color:var(--green)}.chip.doing{color:var(--blue)}.chip.wait{color:var(--mut)}
.chip .d{width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff}
.chip.done .d{background:var(--green)}.chip.doing .d{background:var(--blue)}.chip.wait .d{background:#fff;border:1px solid var(--mut);color:var(--mut)}
.link{color:var(--blue);font-size:12px;cursor:pointer;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}
.act{background:var(--teal-l);border:1px solid #cfe9e4;border-radius:10px;padding:14px 16px;margin-bottom:10px}
.act h4{margin:0 0 4px;color:var(--teal-d);font-size:17px}
.act p{margin:0 0 8px;color:var(--sub);font-size:13px}
.meta{display:flex;gap:16px;color:var(--sub);font-size:12px;margin-bottom:10px;align-items:center}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:3px}.dots i.off{background:#c9d3da}
.btn-t{width:100%;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px;font-weight:700;font-size:15px}
.btn-t:hover{background:var(--teal-d)}.btn-t.ok{background:#7fbfb6}
.goal{background:#f6f8fa;border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px}
.goal h5{margin:0 0 6px;font-size:13px}.goal li{list-style:none;font-size:12px;color:var(--sub);margin-bottom:3px}
.goal li:before{content:"✓";color:var(--teal);margin-right:6px;font-weight:700}
.goal .tg{font-size:44px;align-self:flex-end;opacity:.55}
.steps{display:flex;align-items:flex-start;gap:0;margin:6px 0 12px}
.step{flex:1;text-align:center;position:relative;padding:0 4px}
.step:not(:last-child):after{content:"";position:absolute;top:16px;left:calc(50% + 20px);right:calc(-50% + 20px);border-top:1.5px dashed #b8c3d0}
.step .n{width:32px;height:32px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);display:inline-grid;place-items:center;font-weight:700;background:#fff}
.step.hi .n{background:var(--blue);color:#fff}
.step b{display:block;font-size:12.5px;margin-top:4px}.step.hi b{color:var(--blue)}
.step small{display:block;font-size:11px;color:var(--sub);line-height:1.35}
.note{background:var(--blue-l);color:var(--blue);text-align:center;padding:9px;border-radius:8px;font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:150px}
.stat h4{margin:0 0 8px;font-size:14px}
.big{font-size:32px;font-weight:700;color:var(--teal)}.big small{font-size:15px;color:var(--teal);font-weight:600}
.sub{color:var(--sub);font-size:12px}.up{color:var(--green)}
.ringwrap{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;color:var(--teal)}
.glist label{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;cursor:pointer;color:var(--sub)}
.glist input{accent-color:var(--teal);width:16px;height:16px}
.glist input:checked+span{color:var(--ink)}
.case8{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.case8 .c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfdfe;font-size:12px;color:var(--sub)}
.case8 .c b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
.tasks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tasks .c{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--sub);background:#fcfdfe}
.tasks .c b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
.tasks .c em{font-style:normal;color:var(--green);font-weight:600}
.banner{display:flex;align-items:center;gap:14px;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;margin-top:14px}
.banner .l{display:flex;align-items:center;gap:12px}.banner .ok{width:34px;height:34px;border-radius:8px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:20px}
.banner b{color:var(--green)}
.btn-b{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;padding:9px 18px;font-weight:600}
.btn-b.fill{background:var(--blue);color:#fff}
/* chat */
.tutor{background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.tutor .th{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.tutor .th b{font-size:16px}.on-l{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}.on-l:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
.newc{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600}
.msgs{padding:12px 12px 4px;flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.tutor .inrow,.tutor .qb,.tutor .th{flex:none}
.m{display:flex;gap:8px;max-width:100%}.m.u{justify-content:flex-end}
.bot-av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:15px}
.bub{border-radius:12px;padding:9px 12px;font-size:13px;position:relative;background:#eaf1fc;max-width:86%;white-space:pre-wrap}
.m.u .bub{background:#dff5e6}
.bub time{display:block;text-align:right;color:var(--mut);font-size:10.5px;margin-top:3px}
.m.c .bub{background:#fff;border:1px solid var(--line);max-width:calc(100% - 38px);margin-left:38px}
.m.c .bub .ct{font-weight:700;margin-bottom:4px;font-size:12.5px}
.m.c .bub .cs{color:var(--sub);font-size:11.5px;margin-top:6px}
.typing{color:var(--mut);font-size:12px;padding-left:38px}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mut);margin-right:3px;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.sbar{margin:6px 0;display:grid;grid-template-columns:34px 92px 1fr;gap:0;font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sbar span{padding:6px 8px;border-bottom:1px solid var(--line)}.sbar .k{font-weight:700;text-align:center;color:#fff}
.sbar span:nth-last-child(-n+3){border-bottom:0}
.inrow{display:flex;gap:8px;padding:8px 12px 4px}
.inrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.inrow button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:0 14px;font-weight:600}
.qb{display:flex;gap:8px;padding:6px 12px 14px;flex-wrap:wrap}
.qb button{border-radius:8px;padding:8px 14px;font-weight:600;border:1px solid var(--blue);background:#fff;color:var(--blue)}
.qb button.p{background:var(--blue);color:#fff}
.ev{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ev .eh{display:flex;justify-content:space-between;margin-bottom:10px}.ev .eh b{font-size:15px}.ev .eh small{color:var(--sub);font-weight:400}
.evi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:start}
.evi.flash{animation:fl 1.6s}
@keyframes fl{0%,60%{background:#fff7d6}100%{background:#fff}}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;margin-right:6px;color:#fff;background:var(--teal)}
.tag.교과서{background:#8a7fd0}.tag.학술논문,.tag.연구{background:#d1873a}.tag.교육자료,.tag.참고문헌,.tag.간호실무{background:#4a8fd0}
.evi b{font-size:13px}.evi small{display:block;color:var(--sub);font-size:11.5px;margin-top:2px}
.src{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:7px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.port{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.port div{font-size:11px;color:var(--sub)}.port b{display:block;font-size:20px;color:var(--teal)}
.disc{display:flex;gap:8px;font-size:11.5px;color:var(--sub);padding:2px 4px}
/* other views */
.vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.vh h2{margin:0;font-size:22px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.wc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;transition:.15s}
.wc:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(27,95,208,.12)}
.wc.cur{border:2px solid var(--blue)}
.wc small{color:var(--teal);font-weight:700}.wc h4{margin:4px 0 6px;font-size:15px}.wc p{margin:0;color:var(--sub);font-size:12px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.tbl th{background:#f6f8fa;color:var(--sub)}
.hb{display:flex;align-items:center;gap:8px}.hb i{display:block;height:9px;background:var(--teal);border-radius:5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters button,.filters input{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font:inherit}
.filters button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.filters input{border-radius:8px;min-width:220px}
.fb{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.fb small{color:var(--sub)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.on{display:flex}
.md{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.md h3{margin:0 0 10px;font-size:18px}.md .x{float:right;border:0;background:none;font-size:22px;color:var(--mut)}
.md textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;resize:vertical}
.md ol,.md ul{padding-left:20px}.md li{margin-bottom:6px}
.md .rowb{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.md .chk label{display:flex;gap:8px;margin:7px 0;align-items:flex-start}
.quote{background:#f6f8fa;border-left:3px solid var(--teal);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13px;margin:8px 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1}
.nav em{font-style:normal}
@media(max-width:1380px){
  .body,.body.nosb{grid-template-columns:64px minmax(0,1fr) 400px}
  .body.nosb{grid-template-columns:0 minmax(0,1fr) 400px}
  .side{padding:14px 8px;align-items:center}.side .box{display:none}
  .nav button{justify-content:center;padding:11px 0}.nav em{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}
  .case8,.tasks{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1000px){
  .app{height:auto}.body,.body.nosb{display:block}
  .side{display:none}.main{overflow:visible}.rt{overflow:visible;border-left:0}
  .rt .tutor{flex:none}.msgs{flex:none;height:70vh;min-height:420px}.rt .ev{max-height:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}.case8,.tasks{grid-template-columns:repeat(2,1fr)}
  .app{grid-template-rows:auto auto}
  .hdr{flex-wrap:wrap;height:auto;padding:8px 14px;gap:8px 12px}
  .hdr h1{font-size:15px;white-space:normal}.heroart{display:none}.pop{right:10px;top:100px}.user div{display:none}.demo{display:none}
  .hdr .sp{display:none}.hero h2{font-size:22px}.stats{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){.stats,.case8,.tasks{grid-template-columns:1fr}.steps{overflow-x:auto}.step{min-width:110px}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <button class="burger" id="burger" aria-label="메뉴 접기/펼치기">☰</button>
    <h1>CJMM 기반 RAG 심혈관 간호 튜터링 시스템</h1>
    <span class="demo">가상 데모 · 실제 임상 사용 불가</span>
    <span class="sp"></span>
    <div class="weekpill">📅 8주 중재 프로그램 ·
      <button id="prev" aria-label="이전 주차">‹</button>
      <select id="wsel" aria-label="주차 선택"></select>
      <button id="next" aria-label="다음 주차">›</button>
    </div>
    <button class="bell" id="bell" aria-label="알림">🔔<span class="badge" id="badge">3</span></button>
    <div class="pop" id="pop"></div>
    <div class="user"><div><b>김지현 학생</b><small>3학년 · 성인간호학실습</small></div><div class="avatar">👤</div></div>
  </header>
  <div class="body" id="body">
    <aside class="side">
      <nav class="nav" id="nav"></nav>
      <div class="box">
        <h4>프로그램 개요</h4>
        <div class="kv"><span>기간</span><span>8주 프로그램<br>2024.05.13 ~ 2024.07.07</span></div>
        <div class="kv" style="justify-content:space-between;margin-bottom:0"><span>진행률</span><span id="pg">1 / 8주차</span></div>
        <div class="bar"><i id="pgbar"></i></div>
        <button class="btn-o" id="detail">상세 보기</button>
      </div>
      <div style="flex:1"></div>
      <div class="box">
        <h4>🎧 도움말</h4>
        <button class="btn-o" id="guide" style="text-align:left;display:flex;justify-content:space-between"><span>시스템 사용 가이드</span><span>›</span></button>

function ring(p,sz=84,sw=9){const r=(sz-sw)/2,c=2*Math.PI*r;return `<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#e1e8ee" stroke-width="${sw}"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#0e8f80" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${sz/2} ${sz/2})"/></svg><b>${p}%</b></div>`}
function heroSvg(){return `<svg width="150" height="110" viewBox="0 0 150 110"><path d="M52 98C14 66 6 46 12 28c6-18 30-20 40-4 10-16 34-14 40 4 6 18-2 38-40 70z" fill="#1e88c9" opacity=".92"/><path d="M12 56h22l8-18 12 34 9-22h26" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function chipHtml(s){const m={done:['✓','완료'],doing:['●','진행 중'],wait:['','대기']}[s];return `<span class="chip ${s}"><span class="d">${m[0]}</span>${m[1]}</span>`}
function goalList(w){const k='g'+w.n;S.goals[k]=S.goals[k]||{};return ''}
function stat(st,w,i){
  if(st.t==='ring')return `<div class="stat"><h4>${st.h}</h4><div class="ringwrap">${ring(st.pct)}<div class="sub">${st.l.join('<br>')}</div></div></div>`;
  if(st.t==='met')return `<div class="stat"><h4>${st.h}</h4><div class="big">${st.v}<small>${st.u}</small> <span class="sub">${st.x}</span></div><div class="sub" style="margin-top:6px">${st.l.join('<br>')}</div><div style="margin-top:8px"><button class="link" data-go="rec">자세히 보기 ›</button></div></div>`;
  if(st.t==='icon')return `<div class="stat"><h4>${st.h}</h4><div style="display:flex;gap:12px;align-items:center"><span style="font-size:42px">${st.ic}</span><div><div class="big">${st.v}<small>${st.u}</small></div><div class="sub up">${st.x}</div></div></div></div>`;
  const key=w.n+'-'+i;S.goals[key]=S.goals[key]||st.g.map(g=>!!g[1]);
  return `<div class="stat"><h4>${st.h}</h4><div class="glist">${st.g.map((g,j)=>`<label><input type="checkbox" data-g="${key}|${j}" ${S.goals[key][j]?'checked':''}><span>${g[0]}</span></label>`).join('')}</div></div>`;
}

/* ============ 대시보드 ============ */
function dash(){
  const w=cur(), done=S.acts[w.n];
  let top;
  if(w.case){
    top=`<div class="card" style="margin-bottom:14px"><h3>통합 사례 개요</h3><div style="margin:-4px 0 10px;color:var(--sub)">📍 ${w.case.ov}</div><div class="case8">${w.case.cards.map((c,i)=>`<div class="c"><b>${['🩸','🩺','📈','📜','🛏️'][i]} ${c[0]}</b>${nl(c[1])}</div>`).join('')}</div></div>
    <div class="card" style="margin-bottom:14px"><h3>8주차 핵심 과제 (통합 평가)</h3><div class="tasks">${w.case.tasks.map(t=>`<div class="c"><b>${t[0]}</b>${t[1]}<br><em>✓ 완료</em></div>`).join('')}</div>
    <div style="margin-top:12px"><button class="btn-t" style="max-width:260px" data-act="1">${done?'통합 사례 평가 다시 보기':'통합 사례 평가 답안 작성'}</button></div></div>`;
  }else{
    const left=`<div class="card"><h3>${w.listTitle}</h3>${w.items.map((it,i)=>`<div class="item"><div class="ic" style="background:${ICBG[i%6]}">${ICE[i%6]}</div><div class="tx"><b>${it[0]}</b><small>${it[1]}</small></div>${chipHtml(it[2])}</div>`).join('')}${w.listH?`<button class="link" data-go="weeks">${w.listH} ›</button>`:''}</div>`;
    const dots=[1,2,3].map(i=>`<i class="${i<=w.act.lv?'':'off'}"></i>`).join('');
    const right=`<div class="card"><h3>${w.actTitleBox||w.n+'주차 '+(w.n===1?'핵심 활동':'학습 활동')}</h3>
      <div class="act"><h4>${w.act.h} ${w.n===1?'':''}</h4><p>${w.act.p}</p><div class="meta"><span>🕒 예상 소요 시간 ${w.act.min}분</span><span>📶 난이도 <span class="dots">${dots}</span></span></div>
      <button class="btn-t ${done?'ok':''}" data-act="1">${done?'✓ 제출 완료 · 다시 보기':w.act.btn}</button></div>
      ${w.act2?`<div class="act" style="background:#f6f8fa;border-color:var(--line)"><h4 style="color:var(--ink);font-size:15px">${w.act2.h}</h4><p>${w.act2.p}</p><ul style="margin:0;padding-left:18px;font-size:12.5px;color:var(--sub)">${w.act2.g.map(g=>`<li>${g}</li>`).join('')}</ul></div>`
      :`<div class="goal"><div><h5>이번 주 학습 목표</h5><ul style="margin:0;padding:0">${w.goals.map(g=>`<li>${g}</li>`).join('')}</ul></div><div class="tg">🎯</div></div>`}</div>`;
    top=`<div class="cols">${left}${right}</div>`;
  }
  const steps=w.cj.map((c,i)=>`<div class="step ${w.hi.includes(i)?'hi':''}"><span class="n">${i+1}</span><b>${c[0]}</b><small>${c[1]}</small></div>`).join('');
  return `<div class="hero"><div><small>${w.n}주차 학습 주제</small><h2>${w.title}</h2><p>${w.desc}</p></div><div class="heroart">${heroSvg()}<span class="emo">${w.hero}</span></div></div>
  ${top}
  <div class="card"><h3>CJMM 6단계 학습 목표 <span style="font-weight:400;color:var(--sub)">(${w.cjLabel})</span></h3><div class="steps">${steps}</div><div class="note">${w.note}</div></div>
  <div class="stats">${w.stats.map((s,i)=>stat(s,w,i)).join('')}</div>
  ${w.n===8?`<div class="banner"><div class="l"><div class="ok">✓</div><div><b>축하합니다! 8주 중재 프로그램을 모두 완료했습니다.</b><div class="sub">지속적인 학습과 임상 적용을 통해 전문가로 발전시켜 나가세요.</div></div></div><div style="display:flex;gap:8px"><button class="btn-b" data-go="rec">전체 학습 리포트 보기</button><button class="btn-b fill" id="cert">수료증 다운로드</button></div></div>`:''}`;
}

/* ============ 다른 보기 ============ */
function weeksView(){return `<div class="vh"><h2>주차별 학습</h2><span class="sub">데모에서는 모든 주차를 자유롭게 열람할 수 있습니다.</span></div><div class="wgrid">${W.map(w=>`<div class="wc ${w.n===S.wk?'cur':''}" data-week="${w.n}"><small>${w.n}주차 ${w.n===S.wk?'· 보는 중':''}</small><h4>${w.title}</h4><p>CJMM 집중: ${w.hi.length&&w.hi.length<6?w.hi.map(i=>CJ[i]).join(' · '):(w.hi.length?'전 단계 통합':'개념 이해와 연습')}</p></div>`).join('')}</div>`}
function casesView(){return `<div class="vh"><h2>사례학습</h2><span class="sub">사례를 열면 해당 주차의 튜터 대화로 이동합니다.</span></div><div class="wgrid">${W.filter(w=>w.caseT).map(w=>`<div class="wc" data-week="${w.n}" data-chat="1"><small>${w.n}주차 사례</small><h4>${w.caseT[0]}</h4><p>${w.caseT[1]}</p></div>`).join('')}</div>`}
const EVF={f:'전체',q:''};
function evView(){const all=[];W.forEach(w=>w.ev.forEach((e,i)=>all.push({w:w.n,i,e})));
  const tags=['전체',...new Set(all.map(a=>a.e.tag))];const f=EVF.f,q=EVF.q.toLowerCase();
  const list=all.filter(a=>(f==='전체'||a.e.tag===f)&&(!q||(a.e.ti+a.e.meta+a.e.rec).toLowerCase().includes(q)));
  return `<div class="vh"><h2>근거자료</h2><span class="sub">${list.length}건 · 주차별 RAG 검색 결과 모음</span></div>
  <div class="filters">${tags.map(t=>`<button class="${t===f?'on':''}" data-tag="${t}">${t}</button>`).join('')}<input id="eq" placeholder="제목·내용 검색" value="${esc(EVF.q)}"></div>
  ${list.map(a=>`<div class="evi" style="background:#fff;margin-bottom:8px"><div><span class="tag ${a.e.tag}">${a.e.tag}</span><b>${esc(a.e.ti)}</b><small>${a.w}주차 · ${esc(a.e.meta)}</small><small>${esc(a.e.rec)}</small></div><button class="src" data-ev="${a.w}|${a.i}">출처 보기</button></div>`).join('')||'<div class="card">검색 결과가 없습니다.</div>'}`}
function recView(){return `<div class="vh"><h2>나의 수행기록</h2><span class="sub">주차별 대표 지표(가상 데이터)</span></div>
  <table class="tbl"><tr><th>주차</th><th>주제</th><th>대표 지표</th><th style="width:34%">점수</th><th>활동</th></tr>${W.map(w=>`<tr><td>${w.n}주차</td><td>${w.title}</td><td>${w.score[0]}</td><td><div class="hb"><i style="width:${w.score[1]*.8}%"></i><b>${w.score[1]}</b></div></td><td>${S.acts[w.n]?'<span class="up">제출함</span>':'<span class="sub">–</span>'}</td></tr>`).join('')}</table>`}
function fbView(){return `<div class="vh"><h2>교수자 피드백</h2><span class="sub">담당 교수 (가상)</span></div>${W.map(w=>`<div class="fb"><small>${w.n}주차 · ${w.title}</small><div style="margin-top:4px">${w.fbk}</div></div>`).join('')}`}

/* ============ 오른쪽: 튜터 + 근거 ============ */
function chatArr(){const w=cur();if(!S.chats[w.n])S.chats[w.n]=w.chat.map(m=>({...m}));return S.chats[w.n]}
function msgHtml(m){
  const av='<div class="bot-av">🤖</div>';
  const sb=m.sbar?`<div class="sbar">${[['S','Situation','현재 상황을 간단히 요약하세요.','#6b4fd0'],['B','Background','관련 병력, 현재 상태의 배경 정보를 작성하세요.','#1b5fd0'],['A','Assessment','현재 상태에 대한 임상적 판단을 작성하세요.','#d9731d'],['R','Recommendation','요청 사항과 이유를 작성하세요.','#2aa05a']].map(r=>`<span class="k" style="background:${r[3]}">${r[0]}</span><span><b>${r[1]}</b></span><span>${r[2]}</span>`).join('')}</div>`:'';
  const evb=m.ev!=null?`<div style="margin-top:6px"><button class="src" data-ev="${S.wk}|${m.ev}">출처 보기</button></div>`:'';
  if(m.r==='case')return `<div class="m c"><div class="bub">${m.ti?`<div class="ct">${m.ti}</div>`:''}${nl(m.t)}${m.s?`<div class="cs">${esc(m.s)}</div>`:''}<time>${m.time}</time></div></div>`;
  if(m.r==='user'&&!m.asBot)return `<div class="m u"><div class="bub">${nl(m.t)}<time>${m.time} ✓✓</time></div></div>`;
  if(m.asBot)return `<div class="m u"><div class="bub" style="background:#fff;border:1px solid var(--line)">${nl(m.t)}<time>${m.time}</time></div></div>`;
  return `<div class="m">${av}<div class="bub">${nl(m.t)}${sb}${evb}<time>${m.time}</time></div></div>`;
}
function rt(){
  const w=cur();
  const msgs=chatArr().map(msgHtml).join('');
  const evs=w.ev.map((e,i)=>`<div class="evi" id="evi${i}"><div><span class="tag ${e.tag}">${e.tag}</span><b>${esc(e.ti)}</b><small>${esc(e.meta)}</small><small>${esc(e.rec)}</small></div><button class="src" data-ev="${w.n}|${i}">출처 보기</button></div>`).join('');
  const port=w.n===8?`<div class="ev"><div class="eh"><b>근거 포트폴리오 <small>(8주차)</small></b><button class="link" data-go="ev">더보기 ›</button></div><div class="port"><div><b>${18+S.saved.size}건</b>수집 근거</div><div><b>6건</b>핵심 근거</div><div><b>12건</b>인용 문헌</div><div><b>8건</b>노트/요약</div></div></div>`:'';
  return `<div class="tutor"><div class="th"><b>RAG 튜터</b><span class="on-l">온라인</span><button class="newc" id="newc">새 대화</button></div>
    <div class="msgs" id="msgs">${msgs}</div>
    <div class="inrow"><input id="inp" placeholder="튜터에게 질문하거나 답을 입력하세요" autocomplete="off"><button id="snd">보내기</button></div>
    <div class="qb"><button class="p" id="gd">근거 확인 가이드 보기</button><button id="sm">대화 요약 보기</button></div></div>
    <div class="ev"><div class="eh" style="margin-bottom:6px"><b>근거 자료 <small>(RAG 검색 결과)</small></b><button class="link" data-go="ev">더보기 ›</button></div><div class="evl">${evs}</div></div>
    ${port}
    <div class="disc"><span>ⓘ</span><span>본 RAG 튜터의 답변은 생성형 AI 기반으로, 임상 판단은 반드시 전문가의 검토와 최신 지침을 함께 확인하세요. 이 페이지의 환자·문헌 정보는 모두 가상 데모 자료입니다.</span></div>`;
}

/* ============ 렌더 ============ */
function render(keepChat){
  const w=cur();
  $('#wsel').value=S.wk;$('#prev').disabled=S.wk===1;$('#next').disabled=S.wk===8;
  $('#pg').textContent=S.wk+' / 8주차';$('#pgbar').style.width=(S.wk/8*100)+'%';
  $('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]===S.view?'on':''}" data-v="${n[0]}"><span>${n[1]}</span><em>${n[2]}</em></button>`).join('');
  const v={dash,weeks:weeksView,cases:casesView,ev:evView,rec:recView,fb:fbView}[S.view];
  $('#main').innerHTML=v();
  if(!keepChat){$('#rt').innerHTML=rt();const m=$('#msgs');m.scrollTop=m.scrollHeight}
  document.title=`${w.n}주차 · CJMM 기반 RAG 심혈관 간호 튜터링 시스템 (가상 데모)`;
}
function setWeek(n,view){S.wk=n;if(view)S.view=view;render();$('#main').scrollTop=0}

/* ============ 모달 ============ */
function modal(h){$('#md').innerHTML=`<button class="x" id="mx" aria-label="닫기">×</button>${h}`;$('#ov').classList.add('on')}
function closeM(){$('#ov').classList.remove('on')}
function evModal(wn,i){
  const e=W[wn-1].ev[i],key=wn+'-'+i;
  const chk=['출처 기관·저자가 신뢰할 만한가','발행 연도가 최신인가','권고 등급·근거 수준이 표시되어 있는가','AI 답변의 표현 강도와 근거가 일치하는가'];
  S.checked.add(key);
  modal(`<h3>${esc(e.ti)}</h3><div><span class="tag ${e.tag}">${e.tag}</span><span class="sub">${wn}주차 근거</span></div>
  <p class="sub" style="margin:10px 0 4px">서지 정보</p><div>${esc(e.meta)}</div>
  <p class="sub" style="margin:12px 0 4px">RAG가 찾아온 근거 요약 (가상)</p><div class="quote">${esc(e.rec)}</div>
  <p class="sub" style="margin:12px 0 4px">근거 확인 체크리스트</p><div class="chk">${chk.map(c=>`<label><input type="checkbox"> ${c}</label>`).join('')}</div>
  <div class="rowb"><button class="btn-b" id="sv">${S.saved.has(key)?'포트폴리오에 저장됨 ✓':'근거 포트폴리오에 저장'}</button><button class="btn-b fill" id="mc">닫기</button></div>
  <p class="sub" style="font-size:11.5px">※ 이 화면의 문헌 정보는 가상 데모입니다. 실제 인용 전에는 원문을 직접 확인하세요.</p>`);
  $('#sv').onclick=()=>{S.saved.add(key);$('#sv').textContent='포트폴리오에 저장됨 ✓';toast('근거를 포트폴리오에 저장했습니다');if(S.wk===8)$('#rt').innerHTML=rt()};
  $('#mc').onclick=closeM;
}
function actModal(){
  const w=cur();
  modal(`<h3>${w.act.h}</h3><p class="sub">예상 ${w.act.min}분 · 난이도 ${'●'.repeat(w.act.lv)}${'○'.repeat(3-w.act.lv)}</p>
  <div class="quote">${nl(w.act.q)}</div>
  <textarea id="ans" placeholder="답안을 작성하세요. 판단의 근거가 된 출처도 함께 적어 보세요.">${esc((S.acts[w.n]||{}).a||'')}</textarea>
  <div class="rowb"><button class="btn-b" id="mc">취소</button><button class="btn-b fill" id="sub">제출하고 튜터 피드백 받기</button></div>`);
  $('#mc').onclick=closeM;
  $('#sub').onclick=()=>{
    const a=$('#ans').value.trim();if(!a){toast('답안을 먼저 입력해 주세요');return}
    S.acts[w.n]={a};closeM();
    const arr=chatArr();arr.push({r:'user',t:a,time:now()});
    render(false);toast('답안을 제출했습니다');
    botReply(a);
  };
}
function guideModal(){modal(`<h3>근거 확인 가이드</h3><ol><li><b>핵심 주장 찾기</b> – AI 답변에서 확인할 문장 한두 개를 고릅니다.</li><li><b>출처 열기</b> – 오른쪽 근거 자료에서 「출처 보기」로 원문 정보를 확인합니다.</li><li><b>일치 정도 판단</b> – 주장과 근거가 <em>일치 / 부분 일치 / 불일치</em> 중 무엇인지 표현의 강도까지 비교합니다.</li><li><b>근거 수준 기록</b> – 연도, 권고 등급, 근거 유형(가이드라인·교과서·논문)을 함께 남깁니다.</li><li><b>전문가 검토</b> – 임상 판단은 반드시 전문가의 검토와 최신 지침으로 최종 확인합니다.</li></ol><div class="rowb"><button class="btn-b fill" id="mc">확인</button></div>`);$('#mc').onclick=closeM}
function sumModal(){
  const a=chatArr(),u=a.filter(m=>m.r==='user'&&!m.asBot),b=a.filter(m=>m.r==='bot').length;
  modal(`<h3>대화 요약 · ${S.wk}주차</h3><ul><li>주제: ${esc(cur().title)}</li><li>내가 보낸 답변: ${u.length}건 / 튜터 질문·피드백: ${b}건</li><li>열람한 근거: ${[...S.checked].filter(k=>k.startsWith(S.wk+'-')).length} / ${cur().ev.length}건</li></ul>${u.length?'<p class="sub">내 답변 모아보기</p>'+u.map(m=>`<div class="quote">${nl(m.t)}</div>`).join(''):'<p class="sub">아직 보낸 답변이 없습니다.</p>'}<div class="rowb"><button class="btn-b fill" id="mc">닫기</button></div>`);$('#mc').onclick=closeM}
function helpModal(){modal(`<h3>시스템 사용 가이드</h3><ul><li>상단의 <b>‹ ›</b> 또는 주차 선택으로 1~8주차 화면을 바꿉니다.</li><li><b>활동 시작하기</b>에서 답안을 쓰고 제출하면 튜터가 근거 확인을 이어서 물어봅니다.</li><li>튜터 입력창에 질문하면 이번 주 근거 자료 안에서 관련 근거를 찾아 알려줍니다.</li><li>근거 자료의 <b>출처 보기</b>에서 체크리스트를 확인하고 포트폴리오에 저장할 수 있습니다.</li><li>이 페이지는 가상 데모로, 입력한 내용은 서버로 전송되거나 저장되지 않습니다.</li></ul><div class="rowb"><button class="btn-b fill" id="mc">닫기</button></div>`);$('#mc').onclick=closeM}
function certModal(){modal(`<h3>수료증 (가상 데모)</h3><div style="border:3px double var(--teal);border-radius:10px;padding:26px;text-align:center"><div style="font-size:13px;color:var(--sub)">CJMM 기반 RAG 심혈관 간호 튜터링 · 8주 중재 프로그램</div><div style="font-size:26px;font-weight:700;margin:10px 0">수 료 증</div><div style="font-size:18px">김지현 (3학년 · 성인간호학실습)</div><div class="sub" style="margin-top:10px">위 학생은 2024.05.13 ~ 2024.07.07 프로그램을 이수하였음을 확인합니다.<br>※ 가상 데모용 문서입니다.</div></div><div class="rowb"><button class="btn-b" onclick="window.print()">인쇄</button><button class="btn-b fill" id="mc">닫기</button></div>`);$('#mc').onclick=closeM}

/* ============ 튜터 응답 (가상 RAG: 이번 주 근거 키워드 매칭) ============ */
function botReply(text){
  const arr=chatArr(),wn=S.wk,box=$('#msgs');
  if(box){box.insertAdjacentHTML('beforeend','<div class="typing" id="ty"><i></i><i></i><i></i> 튜터가 근거를 찾는 중</div>');box.scrollTop=box.scrollHeight}
  setTimeout(()=>{
    const evs=W[wn-1].ev,q=text.toLowerCase();let best=-1,sc=0;
    evs.forEach((e,i)=>{let s=0;e.kw.forEach(k=>{if(q.includes(k.toLowerCase()))s++});if(s>sc){sc=s;best=i}});
    let m;
    if(best>=0)m={r:'bot',t:`답변과 가장 관련 있는 근거는 「${evs[best].ti}」입니다.\n${evs[best].rec}\n이 내용이 답변의 표현을 그대로 뒷받침하는지, 일부만 지지하는지 출처에서 직접 대조해 보세요.`,ev:best,time:now()};
    else if(/근거|출처|확인|맞/.test(text))m={r:'bot',t:'답변의 핵심 주장 하나를 골라 오른쪽 근거 자료의 출처를 열어 같은 표현이 있는지 대조해 보세요. 표현의 강도까지 일치하는지 보는 것이 포인트입니다.',time:now()};
    else m={r:'bot',t:'좋은 질문이에요. 다만 이 데모 튜터는 이번 주 근거 자료 범위 안에서만 답합니다. 이번 주 핵심 용어를 넣어 다시 질문하거나 「근거 확인 가이드」를 열어 보세요.',time:now()};
    arr.push(m);
    if(S.wk===wn){const t=$('#ty');if(t)t.remove();$('#msgs').insertAdjacentHTML('beforeend',msgHtml(m));$('#msgs').scrollTop=$('#msgs').scrollHeight;
      if(best>=0){const el=$('#evi'+best);if(el){el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}}
  },700);
}
function send(){
  const i=$('#inp'),t=i.value.trim();if(!t)return;i.value='';
  chatArr().push({r:'user',t,time:now()});
  $('#msgs').insertAdjacentHTML('beforeend',msgHtml({r:'user',t,time:now()}));$('#msgs').scrollTop=$('#msgs').scrollHeight;
  botReply(t);
}

/* ============ 이벤트 ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-week],input[type=checkbox]');
  if(!e.target.closest('#pop')&&!e.target.closest('#bell'))$('#pop').classList.remove('on');
  if(e.target.id==='ov')closeM();
  if(!t)return;
  if(t.id==='mx')return closeM();
  if(t.dataset.v){S.view=t.dataset.v;return render(true)}
  if(t.dataset.go){S.view=t.dataset.go;return render(true)}
  if(t.dataset.week){const n=+t.dataset.week;return setWeek(n,t.dataset.chat?'dash':'dash')}
  if(t.dataset.tag){EVF.f=t.dataset.tag;return render(true)}
  if(t.dataset.ev){const [a,b]=t.dataset.ev.split('|').map(Number);return evModal(a,b)}
  if(t.dataset.act)return actModal();
  if(t.dataset.g){const [k,j]=t.dataset.g.split('|');S.goals[k][+j]=t.checked;return}
  switch(t.id){
    case'prev':return setWeek(S.wk-1);case'next':return setWeek(S.wk+1);
    case'detail':S.view='weeks';return render(true);
    case'guide':return helpModal();case'gd':return guideModal();case'sm':return sumModal();
    case'snd':return send();case'cert':return certModal();
    case'newc':S.chats[S.wk]=null;render(false);return toast('새 대화를 시작했습니다');
    case'burger':$('#body').classList.toggle('nosb');return;
    case'bell':{const p=$('#pop');p.innerHTML=NOTICE.map(n=>`<div>${n[0]}<small>${n[1]}</small></div>`).join('');p.classList.toggle('on');$('#badge').style.display='none';return}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='inp'){e.preventDefault();send()}if(e.key==='Escape')closeM()});
document.addEventListener('input',e=>{if(e.target.id==='eq'){EVF.q=e.target.value;const p=e.target.selectionStart;render(true);const n=$('#eq');n.focus();n.setSelectionRange(p,p)}});
$('#wsel').innerHTML=W.map(w=>`<option value="${w.n}">${w.n}주차</option>`).join('');
$('#wsel').onchange=e=>setWeek(+e.target.value);
render();
</script>
</body>
</html>
